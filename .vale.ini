# The configs the README tells you to write, one per summary convention, with
# the package's styles read from the tree instead of a sync.
StylesPath = APIDocs/styles
MinAlertLevel = suggestion

[{fixtures,fixtures/clean}/openapi.json]
BasedOnStyles = APIDocs
View = APIDocs

# The YAML fixture writes its summaries as commands.
[{fixtures,fixtures/clean}/openapi.yaml]
BasedOnStyles = APIDocs, Imperative
View = APIDocs
APIDocs.ThirdPerson = NO
