openapi: 3.0.3
info:
  title: Library API
  description: |
    Lend books to members of a branch library, and take them back.
  version: 1.0.0
tags:
  - name: books
    description: Books in the catalog, with their copies and holds.
  - name: loans
    description: Loans of a copy to a member.
paths:
  /books:
    get:
      tags: [books]
      summary: List books
      description: Return the books in the catalog as JSON, one page at a time.
      parameters:
        - name: limit
          in: query
          description: Maximum number of books to return.
          schema:
            type: integer
        - name: available
          in: query
          description: Whether to return only books with a copy on the shelf.
          schema:
            type: boolean
      responses:
        '200':
          description: A page of books.
    post:
      tags: [books]
      summary: Add a book
      description: Add a book to the catalog and return it with its new ID.
      responses:
        '201':
          description: The book, with its new ID.
  /books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        description: The ID the catalog assigned to the book.
        schema:
          type: string
    get:
      tags: [books]
      summary: Get a book
      description: Return the book with its copies and the URL of its cover.
      responses:
        '200':
          description: The book.
    delete:
      tags: [books]
      summary: Remove a book
      description: Remove the book and its holds once every copy has been withdrawn. Return nothing.
      responses:
        '204':
          description: The book was removed.
  /loans:
    post:
      tags: [loans]
      summary: Lend a copy
      description: Lend a copy to a member for three weeks.
      responses:
        '201':
          description: The new loan.
components:
  schemas:
    Book:
      description: A title in the catalog.
      type: object
      properties:
        isbn:
          type: string
          description: The 13-digit ISBN, without hyphens.
        title:
          type: string
          description: The title as printed on the title page.
        reference:
          type: boolean
          description: Whether the book stays in the library.
        signed:
          type: boolean
          description: Whether the author signed this copy.
    Loan:
      description: A copy lent to a member.
      type: object
      properties:
        due:
          type: string
          format: date
          description: The date the copy is due back, in the member's time zone.
